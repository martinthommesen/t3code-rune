[package]
name = "t3-rune"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fff-search = { git = "https://github.com/dmtrKovalenko/fff.git", rev = "95fd777c2529fc7b4d7572dabff64cc07268f2c5" }
futures-util = { version = "0.3", features = ["sink"] }
hostname = "0.4"
icu_collator = "=2.3.0"
icu_locale_core = "=2.4.0"
icu_properties = "=2.3.0"
image = { version = "0.25", default-features = false, features = [
  "bmp",
  "gif",
  "ico",
  "jpeg",
  "png",
  "webp",
] }
notify = "=9.0.0-rc.4"
portable-pty = "0.9"
regex-lite = "=0.1.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
rune = { git = "https://github.com/anomalyco/rune", rev = "dd672fc8257a1bfb55d2e8595f585fc411e709df", features = [
  "tooling",
  "native-file-dialog",
] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "dd672fc8257a1bfb55d2e8595f585fc411e709df", features = [
  "markdown",
] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
subtle = "2"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
unicode-normalization = "0.1"
unicode-segmentation = "=1.13.3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "=0.19.2", default-features = false }
x11rb = "=0.13.2"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
sys-locale = "=0.3.2"

[patch.crates-io]
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "dd672fc8257a1bfb55d2e8595f585fc411e709df" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "dd672fc8257a1bfb55d2e8595f585fc411e709df" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "dd672fc8257a1bfb55d2e8595f585fc411e709df" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "dd672fc8257a1bfb55d2e8595f585fc411e709df" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "dd672fc8257a1bfb55d2e8595f585fc411e709df" }
winit = { git = "https://github.com/anomalyco/rune", rev = "dd672fc8257a1bfb55d2e8595f585fc411e709df" }

[patch."https://github.com/anomalyco/rune"]
rune = { path = "vendor/rune/crates/rune" }
